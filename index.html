<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACS Student Chapter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f8fbff);
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      padding: 45px 22px 30px;
      text-align: center;
    }

    .hero-image {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 50%;
      border: 6px solid white;
      box-shadow: 0 8px 30px rgba(0,0,0,.18);
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      color: #667085;
      margin: 10px 0 30px;
    }

    .link {
      display: block;
      width: 100%;
      padding: 17px;
      margin: 15px 0;
      border-radius: 16px;
      text-decoration: none;
      color: white;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 6px 18px rgba(0,0,0,.12);
    }

    .registration {
      background: #0a66c2;
    }

    .social {
      background: #111827;
    }

    .footer {
      margin-top: 35px;
      color: #8a94a6;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <img
      class="hero-image"
      src="acs.jpeg"
      alt="ACS Student Chapter"
    >

    <h1>ACS Student Chapter</h1>

    <p class="subtitle">
      Connect with us
    </p>

    <a
      class="link registration"
      href="https://tally.so/r/xXqXBG"
      target="_blank"
    >
      📝 Registration
    </a>

    <a
      class="link social"
      href="https://moamemgamal-lab.github.io/acs-links/"
      target="_blank"
    >
      📱 Social Media
    </a>

    <div class="footer">
      © 2026 ACS Student Chapter
    </div>

  </div>

</body>
</html>
