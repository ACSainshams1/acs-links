<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ACS Student Chapter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f8fbff);
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 45px 22px 30px;
      text-align: center;
    }

    /* ACS IMAGE */
    .hero-image {
      width: 180px;
      height: 180px;
      object-fit: cover;
      display: block;
      margin: 0 auto 22px;
      border-radius: 50%;
      border: 6px solid white;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
    }

    /* TITLE */
    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
    }

    .subtitle {
      margin: 10px 0 30px;
      color: #667085;
      font-size: 16px;
    }

    /* BUTTONS */
    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      margin: 14px 0;
      padding: 16px 20px;
      border-radius: 16px;
      text-decoration: none;
      color: white;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s ease;
    }

    .link:hover {
      transform: translateY(-3px);
    }

    /* FACEBOOK */
    .facebook {
      background: #1877f2;
    }

    /* INSTAGRAM */
    .instagram {
      background: linear-gradient(90deg, #f58529, #dd2a7b, #8134af);
    }

    /* TIKTOK */
    .tiktok {
      background: #111111;
    }

    /* LINKEDIN */
    .linkedin {
      background: #0a66c2;
    }

    .icon {
      margin-right: 10px;
      font-size: 21px;
    }

    .footer {
      margin-top: 35px;
      color: #8a94a6;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- ACS IMAGE -->
    <img
      class="hero-image"
      src="acs.jpeg"
      alt="ACS Student Chapter"
    >

    <!-- TITLE -->
    <h1>ACS Student Chapter</h1>

    <p class="subtitle">
      Connect with us
    </p>

    <!-- FACEBOOK -->
    <a
      class="link facebook"
      href="https://www.facebook.com/share/1WGXzNVfxr/"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="icon">📘</span>
      Facebook
    </a>

    <!-- INSTAGRAM -->
    <a
      class="link instagram"
      href="https://www.instagram.com/acs672019?igsi=MTZyYjF4eHJ0ZjRpYQ=="
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="icon">📸</span>
      Instagram
    </a>

    <!-- TIKTOK -->
    <a
      class="link tiktok"
      href="https://www.tiktok.com/@acs0775?_r=1&_t=ZS-99SIyQQvjaH"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="icon">🎵</span>
      TikTok
    </a>

    <!-- LINKEDIN -->
    <a
      class="link linkedin"
      href="https://www.linkedin.com/company/acschapter/"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="icon">💼</span>
      LinkedIn
    </a>

    <div class="footer">
      © 2026 ACS Student Chapter
    </div>

  </div>

</body>
</html>
